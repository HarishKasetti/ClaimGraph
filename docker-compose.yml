version: "3.9"

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: claimgraph_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: claimgraph
    networks:
      - claimgraph_net

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: claimgraph_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - claimgraph_net

  # ── GROBID ────────────────────────────────────────────────────────────────────
  grobid:
    image: lfoppiano/grobid:0.8.0
    container_name: claimgraph_grobid
    restart: unless-stopped
    ports:
      - "8070:8070"   # REST API
      - "8071:8071"   # Admin / metrics
    environment:
      # -XX:-UseContainerSupport fixes cgroup v2 NullPointerException on WSL2/Windows
      - JAVA_TOOL_OPTIONS=-Xmx4g -XX:-UseContainerSupport
    networks:
      - claimgraph_net

  # ── Qdrant ────────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: claimgraph_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # gRPC / REST API
      - "6334:6334"   # Web UI
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - claimgraph_net

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mongo_data:
  redis_data:
  qdrant_data:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  claimgraph_net:
    driver: bridge
